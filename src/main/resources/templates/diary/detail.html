<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/layout :: layout(~{::title}, ~{::content})">

<head>
    <title>일기 상세 보기</title>
</head>

<body>
<div th:fragment="content" class="diary-main" th:inline="none">
    <div class="page-container">

        <section class="diary-form-wrapper">

            <h2 th:text="${diary.title}">일기 제목</h2>

            <p class="home-hero-info" style="margin-top:4px; margin-bottom:18px;">
                <span th:text="${#temporals.format(diary.createdAt,'yyyy-MM-dd HH:mm')}">작성일</span>
                <span th:if="${diary.emotion != null}">
                    · <span th:text="${diary.emotion}">기분</span>
                </span>
            </p>

            <!-- 2025-12-15 이전: 구 일기(텍스트 + 첨부 이미지 방식) -->
            <div th:if="${diary.createdAt.toLocalDate().isBefore(T(java.time.LocalDate).of(2025, 12, 15))}">
                <div class="diary-lined-view diary-lined-block" style="white-space:pre-wrap; word-break:break-word;">
                    <span th:text="${diary.content}">본문</span>

                    <div th:if="${diary.images != null and !#lists.isEmpty(diary.images)}"
                         class="diary-inline-image-block"
                         style="margin-top:14px;">
                        <img class="diary-inline-image"
                             th:src="@{'/uploads/diary/' + ${diary.images[0].storedFilename}}"
                             alt="첨부 이미지"
                             style="display:block; margin:12px auto; max-width:min(760px, 100%); height:auto; border-radius:16px;">
                    </div>
                </div>
            </div>

            <!-- 2025-12-15 이후: 신 일기(토큰 기반 인라인 렌더) -->
            <div th:if="${!diary.createdAt.toLocalDate().isBefore(T(java.time.LocalDate).of(2025, 12, 15))}">
                <textarea id="diary-raw-content" style="display:none;" th:text="${diary.content}"></textarea>
                <div id="diary-render-root"></div>
                <script th:src="@{/js/diary-content-render.js}"></script>
            </div>

            <div style="margin-top:24px; display:flex; gap:10px;">
                <a th:href="@{/diary/my}" class="btn-secondary">목록으로 돌아가기</a>

                <a th:if="${diary.createdAt.toLocalDate().isEqual(T(java.time.LocalDate).now())}"
                   th:href="@{|/diary/${diary.id}/edit|}"
                   class="btn-primary">수정하기</a>

                <form th:action="@{|/diary/${diary.id}/delete|}"
                      method="post"
                      class="delete-diary-form">
                    <button type="submit"
                            class="btn-secondary"
                            style="background:#ffefef; border:1px solid #ffbcbc;">
                        삭제
                    </button>
                </form>
            </div>

        </section>

    </div>
</div>
</body>
</html>
