<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/layout :: layout(~{::title}, ~{::content})">

<head>
    <title>일기 작성</title>
</head>

<body>
<div th:fragment="content" class="diary-main" th:inline="none">
    <div class="page-container">

        <section class="diary-form-wrapper">
            <h2>오늘의 일기 작성</h2>
            <p class="home-hero-info">
                오늘 있었던 일들을 간단히 적어 두고,
                필요하다면 본문에 사진도 함께 남겨 보세요.
            </p>

            <form id="diary-write-form" method="post">

                <div class="form-field">
                    <label for="title" class="form-label">제목</label>
                    <input id="title"
                           type="text"
                           name="title"
                           class="form-input"
                           placeholder="오늘 하루를 한 줄로 적어 보세요"
                           required>
                </div>

                <div class="form-field">
                    <div class="diary-content-label-row">
                        <label class="form-label">내용</label>

                        <div class="inline-image-tool"
                             data-upload-url="/diary/editor/image-upload"
                             data-target-editor="contentEditor"
                             data-target-textarea="content">
                            <input class="inline-image-input"
                                   type="file"
                                   accept="image/*">
                            <button type="button" class="inline-image-insert-btn">
                                본문에 이미지 삽입
                            </button>
                            <span class="inline-image-hint">커서 위치에 이미지가 들어갑니다.</span>
                        </div>
                    </div>

                    <!-- 실제 편집 영역(이미지가 본문 안에 들어감) -->
                    <div id="contentEditor"
                         class="form-textarea"
                         contenteditable="true"
                         spellcheck="false"
                         style="white-space:pre-wrap; overflow:auto;"></div>

                    <!-- 저장용(서버로 전송되는 값): 토큰 형태로 저장됨 -->
                    <textarea id="content"
                              name="content"
                              required
                              style="display:none;"></textarea>
                </div>

                <div class="form-field">
                    <label for="emotion" class="form-label">오늘의 기분 (선택)</label>
                    <select id="emotion"
                            name="emotion"
                            class="form-select">
                        <option value="">🙂 선택 안 함</option>
                        <option value="기쁨">😄 기쁨</option>
                        <option value="설렘">✨ 설렘</option>
                        <option value="평온">😌 평온</option>
                        <option value="우울">😔 우울</option>
                        <option value="피곤">😴 피곤</option>
                        <option value="화남">😡 화남</option>
                    </select>
                </div>

                <div class="diary-submit-row">
                    <button type="submit" class="diary-submit-btn">
                        일기 저장하기
                    </button>
                </div>

            </form>
        </section>

    </div>

    <script th:src="@{/js/diary-inline-image.js}"></script>
</div>
</body>
</html>
