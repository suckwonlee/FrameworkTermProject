<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/layout :: layout(~{::title}, ~{::content})">

<head>
    <title>일기 수정</title>
</head>

<body>
<div th:fragment="content" class="diary-main" th:inline="none">
    <div class="page-container">

        <section class="diary-form-wrapper">
            <h2>일기 수정하기</h2>
            <p class="home-hero-info">
                본문 안에 이미지를 삽입하면 그대로 저장됩니다.
            </p>

            <form id="diary-edit-form"
                  th:action="@{|/diary/${diary.id}/edit|}"
                  method="post">

                <div class="form-field">
                    <label for="title" class="form-label">제목</label>
                    <input id="title"
                           type="text"
                           name="title"
                           class="form-input"
                           th:value="${diary.title}"
                           required>
                </div>

                <div class="form-field">
                    <div class="diary-content-label-row">
                        <label class="form-label">내용</label>

                        <div class="inline-image-tool"
                             data-upload-url="/diary/editor/image-upload"
                             data-target-editor="contentEditor"
                             data-target-textarea="content">
                            <input class="inline-image-input"
                                   type="file"
                                   accept="image/*">
                            <button type="button" class="inline-image-insert-btn">
                                본문에 이미지 삽입
                            </button>
                            <span class="inline-image-hint">커서 위치에 이미지가 들어갑니다.</span>
                        </div>
                    </div>

                    <!-- 편집 영역 -->
                    <div id="contentEditor"
                         class="form-textarea"
                         contenteditable="true"
                         spellcheck="false"
                         style="white-space:pre-wrap; overflow:auto;"></div>

                    <!-- 저장용 원문(토큰 형태) -->
                    <textarea id="content"
                              name="content"
                              required
                              style="display:none;"
                              th:text="${diary.content}"></textarea>
                </div>

                <div class="form-field">
                    <label for="emotion" class="form-label">오늘의 기분 (선택)</label>
                    <select id="emotion"
                            name="emotion"
                            class="form-select">
                        <option value="">🙂 선택 안 함</option>
                        <option value="기쁨" th:selected="${diary.emotion == '기쁨'}">😄 기쁨</option>
                        <option value="설렘" th:selected="${diary.emotion == '설렘'}">✨ 설렘</option>
                        <option value="평온" th:selected="${diary.emotion == '평온'}">😌 평온</option>
                        <option value="우울" th:selected="${diary.emotion == '우울'}">😔 우울</option>
                        <option value="피곤" th:selected="${diary.emotion == '피곤'}">😴 피곤</option>
                        <option value="화남" th:selected="${diary.emotion == '화남'}">😡 화남</option>
                    </select>
                </div>

                <div class="diary-submit-row">
                    <button type="submit" class="diary-submit-btn">
                        수정 완료
                    </button>
                </div>

            </form>
        </section>

    </div>

    <script th:src="@{/js/diary-inline-image.js}"></script>
</div>
</body>
</html>
